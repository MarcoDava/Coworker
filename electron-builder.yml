appId: com.coworker.app
productName: Coworker
copyright: Copyright © 2025 Marco Dava

directories:
  buildResources: resources
  output: release

files:
  - out/**/*
  - node_modules/active-win/**/*
  - node_modules/discord-rpc/**/*
  - "!**/*.map"

win:
  target:
    - target: nsis
      arch: x64

mac:
  target:
    - target: dmg
      arch: [x64, arm64]

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
